name: Deploy GitHub Pages Showcase

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'web/**'
      - 'statcraft/**'
      - 'scripts/build_web.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build web app (engine bundle)
        run: python scripts/build_web.py

      - name: Assemble site (docs + /app)
        run: |
          mkdir -p _site/app
          cp -r docs/. _site/
          cp -r web/. _site/app/
          rm -rf _site/app/py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
