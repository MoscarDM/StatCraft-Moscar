name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v122.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Tag & Metadata Alignment
        id: meta
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(python -c "from pathlib import Path; import re; print(re.search(r'^__version__\s*=\s*[\"\x27]([^\"\x27]+)', Path('statcraft/__init__.py').read_text(), re.M).group(1))")
            TAG="v$VER"
          fi
          RAW_VER="${TAG#v}"
          RAW_VER="${RAW_VER#V}"
          echo "Resolved release tag: $TAG (version $RAW_VER)"
          python scripts/bump_version.py --check
          SRC_VER=$(python -c "from pathlib import Path; import re; print(re.search(r'^__version__\s*=\s*[\"\x27]([^\"\x27]+)', Path('statcraft/__init__.py').read_text(), re.M).group(1))")
          if [ "$SRC_VER" != "$RAW_VER" ]; then
            echo "::error::Release tag ($TAG -> $RAW_VER) does not match statcraft/__init__.py ($SRC_VER). Run scripts/bump_version.py first."
            exit 1
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RAW_VER" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Application & Setup
        run: |
          python -m PyInstaller --noconfirm --distpath dist/app --workpath build/app StatCraft.spec
          python -m PyInstaller --noconfirm --distpath dist/setup --workpath build/setup installer.spec

      - name: Verify Built Windows Executable (Smoke & SHA-256)
        env:
          QT_QPA_PLATFORM: offscreen
          STATCRAFT_TESTING: '1'
        run: |
          python scripts/verify_built_executable.py --exe dist/app/StatCraft.exe --expected-version "${{ needs.prepare.outputs.version }}" --timeout 120

      - name: Stage Windows Binaries
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "dist/setup/StatCraft-Setup.exe" "artifacts/StatCraft-Setup-v$ver-Windows-x64.exe"
          Copy-Item "dist/app/StatCraft.exe" "artifacts/StatCraft-v$ver-Windows-x64.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/*

  build-macos:
    name: Build macOS (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            label: Apple Silicon arm64
          - runner: macos-15-intel
            arch: x86_64
            label: Intel x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate macOS Icon (.icns)
        run: |
          if [ -f StatCraft.png ]; then
            mkdir -p StatCraft.iconset
            for size in 16 32 128 256 512; do
              sips -z $size $size StatCraft.png --out "StatCraft.iconset/icon_${size}x${size}.png" >/dev/null
              retina=$((size * 2))
              sips -z $retina $retina StatCraft.png --out "StatCraft.iconset/icon_${size}x${size}@2x.png" >/dev/null
            done
            iconutil -c icns StatCraft.iconset -o StatCraft.icns || rm -f StatCraft.icns
            rm -rf StatCraft.iconset
          fi

      - name: Build macOS Application Bundle
        run: |
          python -m PyInstaller --noconfirm --distpath dist/app --workpath build/app StatCraft.spec

      - name: Verify macOS Application (Offscreen Smoke & Version)
        env:
          QT_QPA_PLATFORM: offscreen
          STATCRAFT_TESTING: '1'
        run: |
          python scripts/verify_built_executable.py --exe dist/app/StatCraft.app/Contents/MacOS/StatCraft --expected-version "${{ needs.prepare.outputs.version }}" --timeout 120

      - name: Package DMG and ZIP
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p artifacts
          cd dist/app
          for attempt in 1 2 3; do
            hdiutil create -fs HFS+ -volname "StatCraft" -srcfolder "StatCraft.app" -ov -format UDZO "../../artifacts/StatCraft-v${VER}-macOS-${ARCH}.dmg" && break
            echo "hdiutil attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          if [ ! -f "../../artifacts/StatCraft-v${VER}-macOS-${ARCH}.dmg" ]; then
            echo "::warning::DMG creation failed on runner; continuing with macOS ZIP bundle."
          fi
          ditto -c -k --sequesterRsrc --keepParent "StatCraft.app" "../../artifacts/StatCraft-v${VER}-macOS-${ARCH}.zip"
          cd ../..

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries-${{ matrix.arch }}
          path: artifacts/*

  build-linux:
    name: Build Linux x86_64
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libgl1 libglx-mesa0 libegl1 libdbus-1-3 libfontconfig1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Linux Executable
        run: |
          python -m PyInstaller --noconfirm --distpath dist/app --workpath build/app StatCraft.spec

      - name: Verify Linux Executable (Offscreen Smoke & Version)
        env:
          QT_QPA_PLATFORM: offscreen
          STATCRAFT_TESTING: '1'
        run: |
          python scripts/verify_built_executable.py --exe dist/app/StatCraft --expected-version "${{ needs.prepare.outputs.version }}" --timeout 120

      - name: Package Linux Tarball (.tar.gz)
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          mkdir -p artifacts
          STAGE="StatCraft-v${VER}-Linux-x86_64"
          mkdir -p "$STAGE"
          cp dist/app/StatCraft "$STAGE/"
          cp StatCraft.png "$STAGE/"
          cp statcraft.desktop "$STAGE/"
          chmod +x "$STAGE/StatCraft"
          tar -czvf "artifacts/StatCraft-v${VER}-Linux-x86_64.tar.gz" "$STAGE"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: artifacts/*

  publish-release:
    name: Publish Multi-Platform Release
    needs: [prepare, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-all/

      - name: Download macOS arm64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries-arm64
          path: release-all/

      - name: Download macOS x86_64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries-x86_64
          path: release-all/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-all/

      - name: Generate Checksums & Display Release Files
        run: |
          (cd release-all && sha256sum * > SHA256SUMS.txt)
          ls -lh release-all/
          cat release-all/SHA256SUMS.txt

      - name: Publish All Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.release_tag }}"
          FILES=(release-all/*)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating multi-platform assets..."
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "Creating new release $TAG with multi-platform assets..."
            gh release create "$TAG" "${FILES[@]}" --title "StatCraft $TAG" --generate-notes
          fi
          echo "Multi-platform release $TAG published successfully!"
