name: Multi-Platform Test & Quality Assurance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libgl1 libglx-mesa0 libegl1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite (Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          STATCRAFT_TESTING: '1'
        run: |
          python -c "import ctypes, os, sys, unittest, tests; res = unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.discover('tests', top_level_dir='.')); sys.stdout.flush(); sys.stderr.flush(); code = 0 if res.wasSuccessful() else 1; k32 = ctypes.windll.kernel32 if os.name == 'nt' else None; (setattr(k32.GetCurrentProcess, 'restype', ctypes.c_void_p), setattr(k32.TerminateProcess, 'argtypes', [ctypes.c_void_p, ctypes.c_uint]), k32.TerminateProcess(k32.GetCurrentProcess(), code)) if k32 else os._exit(code)"

      - name: Run Headless UI & Calculation Smoke Verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import sys
          from PySide6.QtWidgets import QApplication
          from statcraft.modern_app import ModernWindow
          from statcraft.app import Presenter
          from statcraft.model import Worksheet, Column

          app = QApplication.instance() or QApplication(sys.argv)
          p = Presenter()
          p.worksheet = Worksheet('Smoke', [Column('X', values=[1,2,3,4,5]), Column('Y', values=[2,4,6,8,10])])
          w = ModernWindow(p)
          w.show()
          app.processEvents()
          
          # Perform basic calculation & chart rendering verification
          desc = p.describe_columns([0, 1])
          w.show_result(desc)
          app.processEvents()

          # Verify window grabbed without null
          pix = w.grab()
          assert not pix.isNull(), 'Grabbed offscreen window is null'
          print('Headless UI smoke verification passed successfully on', sys.platform)
          w.close()
          "

      - name: Build Windows Pre-Release Test Binaries
        if: runner.os == 'Windows'
        run: |
          pip install pyinstaller
          python -m PyInstaller --noconfirm --distpath dist/setup installer.spec
          python -m PyInstaller --noconfirm --distpath dist/app StatCraft.spec

      - name: Verify Built Windows Executable (Smoke & SHA-256)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          STATCRAFT_TESTING: '1'
        run: |
          python scripts/verify_built_executable.py --exe dist/app/StatCraft.exe

      - name: Upload Test Executable Artifacts (Pre-Release Testing)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: StatCraft-Windows-PreRelease-Executables
          path: |
            dist/setup/StatCraft-Setup.exe
            dist/app/StatCraft.exe
          retention-days: 14
